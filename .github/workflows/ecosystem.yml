name: URA ecosystem
on:
  workflow_call:

jobs:
  verify:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      UraTestPluginSourcesRoot: ${{ github.workspace }}/plugins
      URA_TEST_PLUGINS_ROOT: ${{ github.workspace }}/plugins
      URA_PLUGIN_SMOKE_PACKAGE_ROOT: ${{ github.workspace }}/artifacts/bin
    steps:
      - uses: actions/checkout@v6
        with:
          path: host
      - name: Check the pinned SDK
        id: sdk
        run: |
          $installed = @(dotnet --list-sdks) -match '^10\.0\.303 '
          "installed=$([bool]$installed)" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        if: steps.sdk.outputs.installed != 'True'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 10.0.303
      - name: Check out the pinned plugins
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          '{"sdk":{"version":"10.0.303","rollForward":"disable"}}' | Set-Content global.json
          foreach ($plugin in Get-Content host/eng/PluginTesting/plugins.json -Raw | ConvertFrom-Json) {
            $path = "plugins/$($plugin.name)"
            git init --quiet $path
            git -C $path remote add origin "https://github.com/$($plugin.repository).git"
            git -C $path fetch --quiet --depth 1 origin $plugin.ref
            git -c core.longpaths=true -C $path checkout --quiet --detach FETCH_HEAD
            git -c core.longpaths=true -C $path submodule update --init --recursive
          }
      - name: Validate publication boundaries
        run: |
          ./host/eng/tests/VerifyUraPluginBuildTargets.ps1
          ./host/eng/PluginTesting/VerifyPublicationBoundary.ps1 -PluginSourcesRoot $env:UraTestPluginSourcesRoot
      - name: Build fresh plugin packages
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($plugin in Get-Content host/eng/PluginTesting/plugins.json -Raw | ConvertFrom-Json) {
            dotnet build "plugins/$($plugin.name)/$($plugin.project)" -c Release -m:1 --artifacts-path "$env:GITHUB_WORKSPACE/artifacts" -p:RuntimeIdentifier=win-x64 -p:SelfContained=false -p:PlatformTarget=AnyCPU -p:GenerateUraPluginManifestOnBuild=true -p:PackageUraPluginOnBuild=true -p:DeployUraPluginToLocalAppDataOnBuild=false
          }
      - name: Run the cross-plugin tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($test in Get-ChildItem host/eng/PluginTesting/Tests -Recurse -Filter '*.csproj' | Sort-Object FullName) {
            dotnet build $test.FullName -c Release -m:1 -p:GenerateUraPluginManifestOnBuild=false -p:PackageUraPluginOnBuild=false -p:DeployUraPluginToLocalAppDataOnBuild=false
            $testArgs = @(if ($test.BaseName -eq 'PluginReplaySmoke') { '--self-test' })
            dotnet run --project $test.FullName -c Release --no-build --no-restore -- @testArgs
          }
